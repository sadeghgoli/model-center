services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-modelcenter}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelcenter}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: ../../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modelcenter}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-modelcenter}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-must-be-long}
      AI_PLATFORM_SECRET: ${AI_PLATFORM_SECRET:-change-me-platform-secret}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8090}
    ports:
      - "127.0.0.1:${API_PORT:-8090}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modelcenter}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-modelcenter}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-must-be-long}
      AI_PLATFORM_SECRET: ${AI_PLATFORM_SECRET:-change-me-platform-secret}
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8090}
    environment:
      API_INTERNAL_URL: http://api:8000
      APP_ENV: development
    ports:
      - "127.0.0.1:${WEB_PORT:-3010}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
