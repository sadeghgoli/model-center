[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./modelcenter.db

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(message)s
